<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "A YallaConecta é tradutora pública?", "acceptedAnswer": {"@type": "Answer", "text": "Não. A YallaConecta é uma agência de tradução, ensino e consultoria intercultural. A tradução juramentada é executada e assinada por Tradutores Públicos parceiros, matriculados na Junta Comercial. A YallaConecta coordena todo o processo — atendimento, análise do documento, terminologia árabe, prazo e entrega. Assim você tem a segurança da fé pública com a conveniência de um interlocutor único."}},{"@type": "Question", "name": "Vocês fazem juramentada e certificada?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, as duas. A certificada é executada diretamente pela YallaConecta. A juramentada é coordenada por nós e executada por tradutor público matriculado na Junta Comercial e parceiro da YallaConecta. Você trata com um interlocutor só, do orçamento à entrega."}}, {"@type": "Question", "name": "Como funciona do primeiro contato até a entrega?", "acceptedAnswer": {"@type": "Answer", "text": "Você manda o documento pelo WhatsApp ou e-mail, e devolvemos um orçamento com prazo e escopo definidos: esse combinado por escrito é a referência do serviço, não uma promessa solta. Aprovado, começamos a produção; qualquer imprevisto no prazo é avisado antes, não depois. Na entrega, se o destino exigir, orientamos sobre reconhecimento de firma em cartório ou apostilamento."}}, {"@type": "Question", "name": "Como funciona a precificação?", "acceptedAnswer": {"@type": "Answer", "text": "Tradução escrita é orçada por lauda, considerando tipo de documento, complexidade terminológica e prazo. Interpretação é por hora ou diária, com deslocamento à parte quando presencial."}}, {"@type": "Question", "name": "Quais formas de pagamento vocês aceitam?", "acceptedAnswer": {"@type": "Answer", "text": "Aceitamos PIX, cartão de débito e cartão de crédito, nas principais bandeiras (Visa, Mastercard, Elo e outras). O link de pagamento é enviado após a confirmação do orçamento."}}, {"@type": "Question", "name": "Vocês assinam NDA?", "acceptedAnswer": {"@type": "Answer", "text": "Sim. Envie o modelo do seu jurídico ou peça o nosso. O sigilo já é padrão de qualquer forma. O NDA apenas formaliza."}}, {"@type": "Question", "name": "Atendem fora de Curitiba, Itapoá, Joinville e São Paulo?", "acceptedAnswer": {"@type": "Answer", "text": "Sim. Tradução escrita é feita à distância para qualquer lugar do Brasil e do exterior, e a interpretação pode ser por videoconferência. O presencial é que se concentra nessas quatro praças."}}, {"@type": "Question", "name": "Posso ser atendido em árabe?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, do primeiro contato à entrega. Árabe é a língua materna de quem conduz o trabalho, não há intermediário nem tradução da conversa. Falamos português, árabe padrão e dialeto sírio-libanês."}}, {"@type": "Question", "name": "Preciso mandar o documento original pelos Correios?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Foto nítida ou PDF legível, frente e verso, já basta para orçar e para traduzir. O original fica com você, em nenhum momento pedimos que se desfaça dele."}}, {"@type": "Question", "name": "Vocês emitem nota fiscal?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, nota fiscal ou recibo em todo serviço. Se a despesa vai ser reembolsada pela sua empresa ou lançada na contabilidade, avise no pedido para já sair no CNPJ correto."}}, {"@type": "Question", "name": "Atendem pessoa física e empresa, ou só uma das duas?", "acceptedAnswer": {"@type": "Answer", "text": "As duas. Pessoa física para documento civil: certidão, diploma, CNH, antecedentes criminais. Empresa para expansão no mercado árabe: contrato social, procuração, catálogo e site localizados. O caminho do orçamento é o mesmo; muda só o que sai na nota fiscal."}}, {"@type": "Question", "name": "Meu nome está escrito de um jeito no passaporte e de outro no documento árabe. E agora?", "acceptedAnswer": {"@type": "Answer", "text": "É o problema mais comum e o que mais causa recusa em balcão. Mande junto o passaporte ou o RNM: a tradução tem que conversar com a grafia já registrada no seu nome no Brasil, e sabemos como tratar a diferença sem invalidar o documento."}}, {"@type": "Question", "name": "Traduzem documentos de qualquer país árabe?", "acceptedAnswer": {"@type": "Answer", "text": "Sim: Síria, Líbano, Palestina, Jordânia, Egito, Marrocos, Iraque, países do Golfo. Cada país tem formato próprio de certidão, carimbo e numeração, e isso muda a leitura. Trabalhar com todos é justamente o que permite reconhecer o padrão de cada um."}}]}</script>

<article class="bg-white border-b border-hair">
  <div class="max-w-3xl mx-auto px-6 py-14 md:py-20">
    <span class="text-[12px] font-mono tracking-[.15em] uppercase text-gold-deep" data-pt="Artigo" data-ar="مقال"></span>
    <h1 class="font-display font-extrabold text-[2rem] md:text-[2.4rem] text-petrol mt-3 leading-tight text-balance"
        data-pt="Como traduzir certidão de nascimento emitida na Síria, no Líbano ou no Egito" data-ar="كيف تُترجم شهادة ميلاد صادرة في سوريا أو لبنان أو مصر"></h1>
    <p class="mt-4 text-[14px] text-ink-mute">
      <span data-pt="Por" data-ar="بقلم"></span>
      <a href="https://ayham-kanjo.github.io" target="_blank" rel="noopener"
         class="font-semibold text-teal hover:text-petrol transition"
         data-pt="Mohamad Ayham Kanjo" data-ar="محمد أيهم كنجو"></a>
    </p>
    <div class="mt-8 space-y-4 text-[15.5px] text-ink-soft leading-relaxed">
        <p data-pt="A certidão árabe tem particularidades que travam quem não conhece o formato: o nome aparece com a cadeia paterna completa (nome, pai, avô, sobrenome de família), a data pode vir no calendário hijri além do gregoriano, e o documento costuma trazer carimbos e anotações manuscritas de averbação que precisam ser lidos e transpostos." data-ar="شهادة الميلاد العربية لها خصوصيات تُربك من لا يعرف شكلها: الاسم يظهر بسلسلة النسب كاملة (الاسم والأب والجد واسم العائلة)، وقد يأتي التاريخ بالتقويم الهجري إلى جانب الميلادي، وغالباً تحمل أختاماً وملاحظات مكتوبة بخط اليد يجب قراءتها ونقلها."></p>
        <p data-pt="A grafia do nome é o ponto mais sensível. Se a tradução escrever o nome de um jeito e o passaporte ou o RNM de outro, o cartório recusa. Por isso pedimos sempre que você envie junto o documento de identidade brasileiro ou o passaporte: a tradução tem que conversar com o que já está registrado no seu nome aqui." data-ar="كتابة الاسم هي النقطة الأكثر حساسية. إن كتبت الترجمة الاسم بشكل وجواز السفر أو بطاقة الإقامة بشكل آخر، يرفض الكاتب بالعدل. لذلك نطلب دائماً إرسال الهوية البرازيلية أو جواز السفر معها: يجب أن تتطابق الترجمة مع ما هو مسجّل باسمك هنا."></p>
        <p data-pt="Fluxo típico: certidão original → legalização no país emissor → tradução juramentada no Brasil → apresentação no cartório ou órgão. Atenção ao ponto que mais gera retrabalho: Síria, Líbano e Egito não integram a Convenção da Apostila: documentos desses países não recebem apostila, e sim legalização consular. Marrocos, Arábia Saudita, Omã e Bahrein, esses sim, são signatários. Confirmamos o caminho do seu país antes de você gastar em cartório." data-ar="المسار المعتاد: الشهادة الأصلية ← التصديق في بلد الإصدار ← ترجمة محلّفة في البرازيل ← تقديمها لكاتب العدل أو الجهة المعنية. انتبه إلى النقطة التي تسبّب أكثر إعادة عمل: سوريا ولبنان ومصر ليست أعضاء في اتفاقية الأبوستيل: مستنداتها لا تُختم بالأبوستيل بل تُصدَّق قنصلياً. أما المغرب والسعودية وعُمان والبحرين فأعضاء فيها. نتحقق من مسار بلدك قبل أن تدفع لدى كاتب العدل."></p>
    </div>
  </div>
</article>

<section class="reveal bg-sand border-b border-hair">
  <div class="max-w-3xl mx-auto px-6 py-12">
    <p class="text-[11px] font-mono uppercase tracking-[.12em] text-teal mb-3" data-pt="Quem escreveu" data-ar="من كتب"></p>
    <p class="text-[14.5px] text-ink-soft leading-relaxed"

    items.forEach(function(el){ io.observe(el); });
  }
  document.getElementById('ano').textContent = new Date().getFullYear();
  aplicaIdioma('pt');
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
